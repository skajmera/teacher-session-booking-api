version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher-session-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/teacher_booking_db
      - CORS_ORIGIN=*
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: teacher-session-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
